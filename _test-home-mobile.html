<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head>
<body>
<iframe id="f" width="390" height="780" style="border:0"></iframe>
<pre id="out">running</pre>
<script>
/* The two mobile homepage features, driven through the real front page in a
   phone-width frame: the visit counter that promotes somebody to the compact
   layout, and the once-a-session splash.

   Both decisions are made in an inline head script before the first paint, so
   almost every check here has to be made on a *fresh document*. The frame is
   reloaded between cases and storage is seeded beforehand, which is the only
   way to test a thing that has already happened by the time you can look. */

const results = [];
const check = (n, c, x) => results.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== '' ? ' :: ' + x : ''));
const wait = ms => new Promise(r => setTimeout(r, ms));
window.addEventListener('error', e => results.push('FAIL pageerror :: ' + e.message));

const frame = document.getElementById('f');

/* Load index.html fresh and hand back its window once the head script has run. */
function load() {
  return new Promise(resolve => {
    frame.onload = () => resolve(frame.contentWindow);
    frame.src = 'index.html?t=' + Math.random();
  });
}

const shown = (w, sel) => shownIn(w, w.document.querySelector(sel));
const shownIn = (w, node) => !!node && w.getComputedStyle(node).display !== 'none';

function seed(w, visits, splashSeen) {
  w.localStorage.clear();
  w.sessionStorage.clear();
  if (visits !== null) w.localStorage.setItem('parea_visits', JSON.stringify(visits));
  if (splashSeen) w.sessionStorage.setItem('parea_splash_seen', '1');
}

/* Rounds played in one game, in that game's own shape. */
function seedPlayed(w, game, played) {
  if (game === 'anagram') {
    w.localStorage.setItem('arcade.anagram.v1', JSON.stringify({ stats: { daysPlayed: played } }));
  } else {
    w.localStorage.setItem('arcade.' + game + '.stats', JSON.stringify({ played }));
  }
}

const dayBefore = n => {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
};

(async () => {
  try {
    let w = await load();

    // ---------- the visit counter ----------
    seed(w, null, false);
    w = await load();
    check('a first-ever visit is recorded as one',
          JSON.parse(w.localStorage.getItem('parea_visits')).count === 1);
    check('and gets the full homepage',
          !w.document.documentElement.classList.contains('compact-home'));

    /* Same day again: a refresh must not promote anybody. */
    const before = w.localStorage.getItem('parea_visits');
    w = await load();
    check('a refresh on the same day does not count again',
          w.localStorage.getItem('parea_visits') === before, w.localStorage.getItem('parea_visits'));

    /* Walk the boundary. Seeding `count: n` and loading on a later day makes
       that load the (n+1)th visit, so `count: 2` is somebody's third. */
    for (const prior of [1, 2]) {
      seed(w, { count: prior, last: dayBefore(1) }, false);
      w = await load();
      const state = JSON.parse(w.localStorage.getItem('parea_visits'));
      check(`visit ${prior + 1} stays on the full homepage`,
            state.count === prior + 1 && !w.document.documentElement.classList.contains('compact-home'),
            'count ' + state.count);
    }

    /* Three days already banked, arriving on a new day: this load is the 4th. */
    seed(w, { count: 3, last: dayBefore(1) }, false);
    w = await load();
    const fourth = w.document.documentElement.classList.contains('compact-home');
    check('the 4th distinct-day visit lands on the compact homepage',
          fourth && JSON.parse(w.localStorage.getItem('parea_visits')).count === 4);

    seed(w, { count: 2, last: dayBefore(1) }, false);
    w = await load();
    check('so the line falls between the 3rd visit and the 4th, not a day later',
          fourth && !w.document.documentElement.classList.contains('compact-home'));

    seed(w, { count: 40, last: dayBefore(2) }, false);
    w = await load();
    check('and every visit after it', w.document.documentElement.classList.contains('compact-home'));

    seed(w, { count: 99, last: dayBefore(1) }, false);
    w = await load();
    check('the count is capped at 99',
          JSON.parse(w.localStorage.getItem('parea_visits')).count === 99);

    seed(w, 'not json at all', false);
    w.localStorage.setItem('parea_visits', '{{{');
    w = await load();
    check('corrupt storage falls back to the full homepage without throwing',
          !w.document.documentElement.classList.contains('compact-home'));

    // ---------- the other way in: three rounds of any one game ----------

    /* Every case here is a first- or second-day visitor, so the visit counter
       could not be the thing letting them through. */
    for (const game of ['shabda', 'snowman', 'anagram']) {
      seed(w, { count: 1, last: dayBefore(1) }, true);
      seedPlayed(w, game, 3);
      w = await load();
      check(`three rounds of ${game} is enough on its own`,
            w.document.documentElement.classList.contains('compact-home'));

      seed(w, { count: 1, last: dayBefore(1) }, true);
      seedPlayed(w, game, 2);
      w = await load();
      check(`two rounds of ${game} is not`,
            !w.document.documentElement.classList.contains('compact-home'));
    }

    /* Two rounds each of three different games is still two rounds of any one
       game. The rule counts depth, not spread. */
    seed(w, { count: 1, last: dayBefore(1) }, true);
    ['shabda', 'snowman', 'anagram'].forEach(g => seedPlayed(w, g, 2));
    w = await load();
    check('two rounds each of all three does not add up to three of one',
          !w.document.documentElement.classList.contains('compact-home'));

    seed(w, { count: 1, last: dayBefore(1) }, true);
    w.localStorage.setItem('arcade.snowman.stats', '{{{ not json');
    seedPlayed(w, 'shabda', 4);
    w = await load();
    check('one unreadable game record does not stop the others counting',
          w.document.documentElement.classList.contains('compact-home'));

    /* Both routes at once must not fight: either is enough, neither is required. */
    seed(w, { count: 9, last: dayBefore(1) }, true);
    seedPlayed(w, 'shabda', 0);
    w = await load();
    check('a long-standing visitor who has never played still gets compact',
          w.document.documentElement.classList.contains('compact-home'));

    // ---------- the compact layout ----------
    seed(w, { count: 9, last: dayBefore(1) }, true);
    w = await load();
    await wait(120);
    check('compact: the three games are on screen', shown(w, '.strip'));

    const strip = w.document.querySelector('.strip');
    const stripItems = [...w.document.querySelectorAll('.strip-item')];
    const cols = w.getComputedStyle(strip).gridTemplateColumns;
    check('compact: all three games on one row', cols.split(' ').length === 3, cols);
    check('compact: on one row in the literal sense, too',
          new Set(stripItems.map(i => Math.round(i.getBoundingClientRect().top))).size === 1);

    /* A launcher, not a shelf of pictures. The full artwork needs room the
       compact layout does not have; the mark does not. */
    check('compact: each tile shows the mark, not the artwork',
          stripItems.every(i => shownIn(w, i.querySelector('.strip-icon')) &&
                                !shownIn(w, i.querySelector('.strip-art'))));

    const icons = stripItems.map(i => i.querySelector('.strip-icon').getBoundingClientRect());
    check('compact: the marks are big enough to tell apart',
          icons.every(box => box.width >= 36 && box.height >= 36),
          icons.map(b => Math.round(b.width) + 'x' + Math.round(b.height)).join('  '));
    check('compact: and every game has its own',
          new Set(stripItems.map(i => i.querySelector('.strip-icon').getAttribute('src'))).size === 3);

    /* The name sits under the mark rather than floating over a picture, which
       is the difference between a tile and a captioned photo. */
    const label = stripItems[0].querySelector('.strip-label');
    check('compact: the name is in the flow beneath the mark',
          w.getComputedStyle(label).position === 'static' &&
          label.getBoundingClientRect().top >= icons[0].bottom - 1);

    check('compact: the marks are decorative, the name does the naming',
          stripItems.every(i => i.querySelector('.strip-icon').getAttribute('alt') === '' &&
                                i.querySelector('.strip-label').textContent.trim().length > 2));
    check('compact: the feature rows are gone', !shown(w, '#games'));
    check('compact: so is the eyebrow and the hero note',
          !shown(w, '.eyebrow') && !shown(w, '.hero-note'));
    check('compact: the mark is up top', shown(w, '.hero-mark'));
    check('compact: the About section is still there', shown(w, '#about'));
    check('compact: the page still has its h1', shown(w, 'h1.display'));

    const tile = w.document.querySelector('.strip-item').getBoundingClientRect();
    check('compact: the whole tile is the tap target',
          w.document.querySelector('.strip-item').tagName === 'A' &&
          tile.height >= 44, Math.round(tile.width) + 'x' + Math.round(tile.height));

    const line = w.document.getElementById('hero-progress');
    check('compact: the hero line says where the day stands',
          shown(w, '#hero-progress') && /done today|first up/.test(line.textContent),
          JSON.stringify(line.textContent));

    check('compact: nothing scrolls sideways',
          w.document.documentElement.scrollWidth <= w.innerWidth,
          w.document.documentElement.scrollWidth + ' vs ' + w.innerWidth);

    /* The games must be reachable without scrolling, which is the whole point. */
    check('compact: all three games are above the fold',
          w.document.querySelector('.strip').getBoundingClientRect().bottom <= w.innerHeight,
          Math.round(w.document.querySelector('.strip').getBoundingClientRect().bottom) + ' of ' + w.innerHeight);

    // ---------- the Unlimited banner ----------
    /* It points at whichever game has had the least attention, counting the
       daily record and the Unlimited one together. Nothing is seeded at this
       point in the run, so all three are level and the tie falls to play order
       — which is why this checks that it names a game and goes somewhere real,
       rather than which game it picked. Which one it picks when the counts
       actually differ is checked below. */
    const cta = w.document.getElementById('unlimited-cta');
    check('compact: the banner is shown and points somewhere',
          !!cta && !cta.hidden && /games\/[a-z]+\/index\.html$/.test(cta.getAttribute('href')),
          cta && cta.getAttribute('href'));
    check('compact: it names a game and says the streak is safe',
          /Shabda|Snowman|Anagram/.test(cta.textContent) && /streak is safe/i.test(cta.textContent),
          cta.textContent.replace(/\s+/g, ' ').trim());
    check('compact: and it carries a label for a screen reader',
          /Unlimited/.test(cta.getAttribute('aria-label') || ''), cta.getAttribute('aria-label'));

    /* Now with the counts apart: Shabda heavily played, Anagram untouched. The
       banner has to offer the one being neglected, not the one already in
       hand. */
    seed(w, { count: 9, last: dayBefore(1) }, true);
    w.localStorage.setItem('arcade.shabda.stats', JSON.stringify({ played: 30, wins: 20 }));
    w.localStorage.setItem('arcade.snowman.stats', JSON.stringify({ played: 12, wins: 6 }));
    w = await load();
    await wait(150);
    const picked = w.document.getElementById('unlimited-cta');
    check('compact: it offers the game with the least attention on it',
          picked.getAttribute('href') === 'games/anagram/index.html',
          picked.getAttribute('href'));
    check('compact: Unlimited rounds count towards that, not just daily ones',
          (() => {
            w.localStorage.setItem('arcade.anagram.unlimited', JSON.stringify({ played: 40, wins: 30 }));
            return true;
          })());
    w = await load();
    await wait(150);
    check('compact: so forty Unlimited rounds move it off that game',
          w.document.getElementById('unlimited-cta').getAttribute('href') !== 'games/anagram/index.html',
          w.document.getElementById('unlimited-cta').getAttribute('href'));

    // ---------- the tab bar ----------
    const tabs = [...w.document.querySelectorAll('.tabs .tab')];
    check('compact: four tabs across the bottom',
          tabs.length === 4 &&
          tabs.map(t => t.textContent.trim()).join('/') === 'Home/Shabda/Snowman/Anagram',
          tabs.map(t => t.textContent.trim()).join('/'));
    check('compact: the bar is pinned to the bottom of the screen',
          w.getComputedStyle(w.document.querySelector('.tabs')).position === 'fixed');
    check('compact: the page you are on is the one marked',
          tabs.filter(t => t.getAttribute('aria-current') === 'page').length === 1 &&
          tabs[0].getAttribute('aria-current') === 'page');
    check('compact: every tab is a comfortable target',
          tabs.every(t => t.getBoundingClientRect().height >= 44),
          Math.round(tabs[0].getBoundingClientRect().height) + 'px');

    /* The done pill said what the seals and the day line already say, and cost
       the header its shape at 390px. */
    check('compact: the header does not repeat that the day is done',
          w.getComputedStyle(w.document.getElementById('play-cta')).display === 'none' ||
          !w.document.getElementById('play-cta').classList.contains('is-done'));

    // ---------- About and Questions, folded away ----------

    /* Unfolded, About and Questions are 634 and 1211 pixels tall, which is what
       turned a layout built for one screen into two thousand pixels of scroll.

       The page did fit exactly, until the Unlimited banner and the tab bar were
       added and took a hundred pixels back. It fits again at 844 and above, and
       on a shorter phone the sign-off card now sits just below the line. That is
       the right thing to lose: what has to be reachable without scrolling is
       what you can act on, so the assertion is about the games and the banner
       rather than about the last card on the page. */
    const barHeight = w.document.querySelector('.tabs').getBoundingClientRect().height;
    const fold = w.innerHeight - barHeight;

    check('compact: the three games sit above the fold, clear of the tab bar',
          w.document.querySelector('.strip').getBoundingClientRect().bottom <= fold,
          Math.round(w.document.querySelector('.strip').getBoundingClientRect().bottom) +
          ' of ' + Math.round(fold));

    check('compact: and so does the Unlimited banner, which is the thing to do next',
          w.document.querySelector('.unlimited').getBoundingClientRect().bottom <= fold,
          Math.round(w.document.querySelector('.unlimited').getBoundingClientRect().bottom) +
          ' of ' + Math.round(fold));

    /* The hero is now told to fill the screen, so About starts under the fold
       rather than halfway up the first one. That is the point of the layout: a
       returning player sees the day, the games and the way on, and the reading
       is somewhere they have to go looking for. */
    check('compact: the reading starts below the fold',
          w.document.getElementById('about').getBoundingClientRect().top >= fold - 1,
          Math.round(w.document.getElementById('about').getBoundingClientRect().top) +
          ' of ' + Math.round(fold));

    /* And the hero does not overshoot it either — the banner is the last thing
       above the line, not the thing pushed under it. */
    check('compact: the hero fills the screen without spilling past it',
          w.document.querySelector('.hero').getBoundingClientRect().bottom <= fold + 2,
          Math.round(w.document.querySelector('.hero').getBoundingClientRect().bottom) +
          ' of ' + Math.round(fold));

    /* Folded, the reading still costs almost nothing: a screen, plus two closed
       bars and the sign-off. Unfolded it is most of a thousand pixels more, and
       that difference is the whole point of the fold. */
    const shutHeight = w.document.documentElement.scrollHeight;
    check('compact: folded, the whole page is barely more than a screen',
          shutHeight <= w.innerHeight + 400,
          shutHeight + ' of ' + w.innerHeight);

    const folds = ['about', 'questions'].map(id => {
      const section = w.document.getElementById(id);
      return { id, section, button: section.querySelector('.section-toggle'),
               body: section.querySelector('.section-body') };
    });

    check('compact: both sections fold', folds.every(f => f.button && f.body));
    check('compact: and start closed',
          folds.every(f => f.button.getAttribute('aria-expanded') === 'false' && f.body.hidden));
    check('compact: the bar says which section it is',
          folds.map(f => f.button.textContent.trim()).join('/') === 'About/Questions',
          folds.map(f => f.button.textContent.trim()).join('/'));

    /* A heading is not a control, so the button goes inside it rather than
       around it — the level still has to be announced. */
    check('compact: the control is a button inside the heading, pointed at its own body',
          folds.every(f => f.button.tagName === 'BUTTON' &&
                           f.button.parentElement.tagName === 'H2' &&
                           f.button.getAttribute('aria-controls') === f.body.id));

    const bar = folds[1].button.getBoundingClientRect();
    check('compact: the whole bar is the tap target, not the word',
          bar.height >= 44 && bar.width > 200, Math.round(bar.width) + 'x' + Math.round(bar.height));

    /* Folded is not gone. A crawler never gets this layout, but the content has
       to be in the document either way. */
    check('compact: folding hides the reading without removing it',
          folds.every(f => f.body.textContent.length > 200),
          folds.map(f => f.body.textContent.length).join(', '));

    folds[1].button.click();
    await wait(60);
    check('compact: a tap opens it',
          folds[1].button.getAttribute('aria-expanded') === 'true' && !folds[1].body.hidden);
    check('compact: and the answers are on screen',
          folds[1].body.getBoundingClientRect().height > 200);
    check('compact: the other one stays shut',
          folds[0].button.getAttribute('aria-expanded') === 'false');

    folds[1].button.click();
    await wait(60);
    check('compact: a second tap closes it again',
          folds[1].button.getAttribute('aria-expanded') === 'false' && folds[1].body.hidden);
    check('compact: and the page is back to the height it was',
          w.document.documentElement.scrollHeight === shutHeight,
          w.document.documentElement.scrollHeight + ' vs ' + shutHeight);

    /* Deliberately not remembered: carrying an opened section across loads would
       hand somebody back the long page they were being spared. */
    folds[1].button.click();
    await wait(40);
    w = await load();
    await wait(120);
    check('compact: an opened section does not stay open next visit',
          w.document.querySelector('#questions .section-toggle').getAttribute('aria-expanded') === 'false');

    // ---------- and the full layout is untouched ----------
    seed(w, { count: 1, last: dayBefore(1) }, true);
    w = await load();
    await wait(120);
    check('full: the feature rows are back', shown(w, '#games'));
    check('full: the strip stays hidden on a phone, as it was', !shown(w, '.strip'));
    check('full: no compact hero', !shown(w, '.hero-mark') && !shown(w, '#hero-progress'));
    check('full: About and Questions are open and unfolded',
          !w.document.querySelector('.section-toggle') &&
          shown(w, '#about') && shown(w, '#questions'));

    // ---------- the splash ----------
    seed(w, { count: 9, last: dayBefore(1) }, false);
    w = await load();
    check('the splash shows on the first load of a session',
          w.document.documentElement.classList.contains('splash-on') &&
          shown(w, '.splash'));
    check('and marks itself seen straight away',
          w.sessionStorage.getItem('parea_splash_seen') === '1');
    check('it announces itself as a status, with a name',
          w.document.getElementById('splash').getAttribute('role') === 'status' &&
          !!w.document.getElementById('splash').getAttribute('aria-label'));
    check('the wordmark is not read out letter by letter',
          w.document.querySelector('.splash-word').getAttribute('aria-hidden') === 'true');

    const splash = w.document.getElementById('splash');
    check('the splash is not gone before the floor',
          !splash.classList.contains('is-out'));

    /* Where the letters come to rest, which is the thing that actually has to be
       right — the journey is decoration, the destination is the wordmark. A
       headless browser runs its timer clock and its animation clock at different
       rates, so waiting and then looking proves nothing; the animations are
       finished by hand and then measured. */
    const word = w.document.querySelector('.splash-word');
    const letters = [...word.querySelectorAll('span')];
    letters.forEach(node => (node.getAnimations ? node.getAnimations() : []).forEach(a => a.finish()));

    const shift = node => {
      const t = w.getComputedStyle(node).transform;
      return t === 'none' ? 0 : new w.DOMMatrix(t).m41;
    };
    check('every letter converges onto its place and stops there',
          letters.every(node => Math.abs(shift(node)) < 0.5),
          letters.map(node => shift(node).toFixed(1)).join(', '));

    /* clientWidth, not innerWidth: innerWidth counts the scrollbar this frame
       has and a phone does not, which would put the centre 7 or 8 pixels off
       and make a correctly centred wordmark look wrong. */
    const box = word.getBoundingClientRect();
    const layoutWidth = w.document.documentElement.clientWidth;
    check('and the wordmark comes to rest centred',
          Math.abs((box.left + box.right) / 2 - layoutWidth / 2) < 2,
          ((box.left + box.right) / 2).toFixed(1) + ' of ' + layoutWidth);

    check('the tagline and the accent mark arrive after the letters have settled',
          w.getComputedStyle(w.document.querySelector('.splash-tag')).animationDelay === '0.9s' &&
          w.getComputedStyle(w.document.querySelector('.splash-dot')).animationDelay === '0.82s');

    await wait(1500);
    check('it has lifted by the time the floor and a loaded page are both past',
          splash.classList.contains('is-out'), 'is-out=' + splash.classList.contains('is-out'));

    await wait(500);
    check('and is taken out of the page entirely',
          !shown(w, '.splash') && !w.document.documentElement.classList.contains('splash-on'),
          w.getComputedStyle(splash).display);
    check('so nothing behind it is covered, and the page is reachable',
          w.document.elementFromPoint(w.innerWidth / 2, 40) !== splash &&
          !splash.contains(w.document.elementFromPoint(w.innerWidth / 2, 40)));

    /* Second load, same session. */
    w = await load();
    check('the splash does not come back later in the session',
          !w.document.documentElement.classList.contains('splash-on') && !shown(w, '.splash'));

    /* A fresh session. */
    w.sessionStorage.clear();
    w = await load();
    check('a new session earns a new splash',
          w.document.documentElement.classList.contains('splash-on'));

    // ---------- R7: the results sheet has two tabs ----------
    seed(w, { count: 9, last: dayBefore(1) }, true);
    /* Two games with an Unlimited record, one with none at all: the third is
       the case R7 names, where a zero state has to look like nothing played
       rather than something broken. */
    w.localStorage.setItem('arcade.shabda.unlimited',
      JSON.stringify({ played: 12, wins: 9, run: 3, best: 5 }));
    w.localStorage.setItem('arcade.snowman.unlimited',
      JSON.stringify({ played: 4, wins: 1, run: 0, best: 1 }));
    w = await load();
    await wait(150);

    const sheet = w.document.getElementById('stats-modal');
    const statsBtn = w.document.getElementById('btn-stats');
    check('the results button is there to open', !!statsBtn && !statsBtn.hidden);
    statsBtn.click();
    await wait(120);

    const tab = m => w.document.querySelector(`#stats-modal .stat-mode-btn[data-stat="${m}"]`);
    check('the sheet offers Today and Unlimited', !!tab('daily') && !!tab('unlimited'));
    check('and opens on Today', tab('daily').getAttribute('aria-pressed') === 'true');

    const rows = () => [...w.document.querySelectorAll('#sheet-rows .sheet-row')];
    check('Today lists one row per game and no total',
          rows().length === 3, rows().length + ' rows');

    tab('unlimited').click();
    await wait(120);
    check('Unlimited lists one row per game and no total',
          rows().length === 3, rows().length + ' rows');
    check('the three rows are the three games',
          rows().map(r => r.querySelector('.sheet-game').textContent).join('/') ===
          'Shabda/Snowman/Anagram',
          rows().map(r => r.querySelector('.sheet-game').textContent).join('/'));

    const figures = row => [...row.querySelectorAll('.sheet-figure')]
      .map(f => ({ value: f.querySelector('b').textContent, label: f.querySelector('span').textContent }));

    const shabdaRow = figures(rows()[0]);
    check('the columns abbreviate to Play, Win, Run, Best',
          shabdaRow.map(f => f.label).join(', ') === 'Play, Win, Run, Best',
          shabdaRow.map(f => f.label).join(', '));
    check('and carry the Unlimited numbers',
          shabdaRow.map(f => f.value).join('/') === '12/75%/3/5',
          shabdaRow.map(f => f.value).join('/'));

    /* The criterion by name: a game with no Unlimited plays shows a zero state
       rather than blank cells. The percentage keeps its dash, because nought
       per cent would claim a record nobody has. */
    const anagramRow = figures(rows()[2]);
    check('a game with no Unlimited plays shows a zero state, not blank cells',
          anagramRow.every(f => f.value.trim().length > 0) &&
          anagramRow.map(f => f.value).join('/') === '0/—/0/0',
          anagramRow.map(f => f.value).join('/'));

    /* R7: no streak language anywhere on the Unlimited tab. Read off what is on
       screen rather than the markup, since the daily wording is still in it. */
    const onScreen = [
      w.document.getElementById('sheet-note').textContent,
      ...[...w.document.querySelectorAll('#sheet-rows .sheet-figure span')].map(n => n.textContent),
      ...[...w.document.querySelectorAll('#sheet-rows .sheet-today')].map(n => n.textContent)
    ].join(' ');
    check('the Unlimited tab never says streak', !/streak/i.test(onScreen), onScreen.slice(0, 90));

    tab('daily').click();
    await wait(120);
    check('Today brings the streak column back',
          figures(rows()[0]).map(f => f.label).join(', ') === 'Played, Solved, Streak, Best',
          figures(rows()[0]).map(f => f.label).join(', '));
    sheet.hidden = true;

  } catch (e) {
    results.push('FAIL threw :: ' + (e && e.message));
  }

  const failed = results.filter(r => r.startsWith('FAIL'));
  document.getElementById('out').textContent =
    results.join('\n') + '\n\n' + (failed.length ? failed.length + ' FAILED' : 'all ' + results.length + ' passed');
  document.title = failed.length ? 'FAIL' : 'OK';
})();
</script>
</body>
</html>
