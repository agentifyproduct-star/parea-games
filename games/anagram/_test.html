<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Anagram tests</title></head>
<body>
<!-- 360px wide on purpose: acceptance criterion 8 is checked in the same frame
     everything else runs in, so the layout is never tested at a kinder size. -->
<iframe id="f" src="index.html" width="360" height="900" style="border:1px solid #333"></iframe>
<pre id="out">running</pre>
<script>
const results = [];
const check = (n, c, x) => {
  results.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== '' ? ' :: ' + x : ''));
  document.getElementById('out').textContent = results.join(String.fromCharCode(10));
};
const wait = ms => new Promise(r => setTimeout(r, ms));
const press = (w, key) => w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key, bubbles: true }));

let started = false;

document.getElementById('f').addEventListener('load', async () => {
  if (started) return;
  started = true;

  const frame = document.getElementById('f');
  const w = frame.contentWindow;
  const d = w.document;
  const A = w.ANAGRAM;

  w.confirm = () => true;                       // a native dialog would block a headless run
  w.onerror = m => check('no page errors', false, m);

  const el = id => d.getElementById(id);
  const closeModals = () => d.querySelectorAll('.modal:not([hidden])').forEach(m => (m.hidden = true));
  const tiles = () => [...d.querySelectorAll('#tray .tile')];
  const answerSlots = () => [...d.querySelectorAll('#slots .answer-slot')];

  /* Puts a chosen day on the board, so a test can rely on a word's shape rather
     than on whatever today happens to be. */
  function useDay(date) {
    const day = A.manifest.days.find(x => x.date === date);
    A.state.day = day;
    A.state.puzzleDate = date;
    A.state.puzzleNumber = day.n;
    A.save.progress = A.blankProgress(date);
    A.beginSlot();
    return day;
  }

  const typeWord = word => [...word].forEach(c => A.typeLetter(c));

  /* A different wrong guess every time. Rotating the scramble keeps exactly the
     available letters while giving a new arrangement, so the duplicate guard
     does not swallow the attempt. */
  function wrongGuess(n) {
    const letters = [...A.scrambleFor()];
    const at = n % letters.length;
    const rotated = letters.slice(at).concat(letters.slice(0, at)).join('');
    return rotated === A.wordFor() ? [...rotated].reverse().join('') : rotated;
  }

  function attempt(n) {
    A.clearInput();
    typeWord(wrongGuess(n));
    return A.submitGuess();
  }
  const solveCurrent = () => { typeWord(A.wordFor()); return A.submitGuess(); };

  await wait(400);
  closeModals();

  try {
    // ---------- the manifest ----------
    const days = A.manifest.days;
    check('manifest carries at least a 180-day runway', days.length >= 180, days.length + ' days');
    check('manifest is dated, not indexed by timestamp',
          days.every(x => /^\d{4}-\d{2}-\d{2}$/.test(x.date)));
    check('a day is one word, not a pair',
          days.every(x => x.w && x.w1 === undefined && x.w2 === undefined));
    check('every word is 5 to 8 letters', days.every(x => x.w.length >= 5 && x.w.length <= 8),
          JSON.stringify(days.reduce((o, x) => (o[x.w.length] = (o[x.w.length] || 0) + 1, o), {})));

    /* The range is only worth having if it is used. A pool that says 5 to 8 and
       deals nothing but fives is a five-letter game with a wider promise. */
    const lengths = new Set(days.map(x => x.w.length));
    check('and all four lengths actually turn up', [5, 6, 7, 8].every(n => lengths.has(n)),
          [...lengths].sort().join(', '));

    check('every word is lowercase alphabetic', days.every(x => /^[a-z]+$/.test(x.w)));
    check('no word repeats across the calendar', new Set(days.map(x => x.w)).size === days.length);
    check('every day ships a definition', days.every(x => x.d && x.d.length > 5));

    // ---------- scrambling, swept across the whole manifest (acceptance 7) ----------
    const sortLetters = s => [...s].sort().join('');
    let sameAsWord = 0, wrongLetters = 0, longRun = 0;
    days.forEach(day => {
      const text = w.SCRAMBLE.scramble(day.w, day.date, { take: day.s }).text;
      if (text === day.w) sameAsWord++;
      if (sortLetters(text) !== sortLetters(day.w)) wrongLetters++;
      if (w.SCRAMBLE.longestKeptRun(day.w, text) > 2) longRun++;
    });
    check('no scramble equals its source word', sameAsWord === 0, sameAsWord + ' offenders');
    check('every scramble uses exactly the source letters', wrongLetters === 0);
    check('no scramble keeps three letters of the word adjacent', longRun === 0, longRun + ' offenders');

    // ---------- determinism across devices and loads (acceptance 1) ----------
    const day0 = A.manifest.days[0];
    const first = w.SCRAMBLE.scramble(day0.w, day0.date, { take: day0.s }).text;
    const second = w.SCRAMBLE.scramble(day0.w, day0.date, { take: day0.s }).text;
    check('the same date yields the same scramble every time', first === second, first);
    check('a second, independent run agrees',
          w.SCRAMBLE.scramble(day0.w, day0.date, { take: day0.s }).text === first);
    check('a different date yields a different arrangement',
          w.SCRAMBLE.scramble(day0.w, day0.date + 'x', { take: day0.s }).text !== first ||
          day0.w.length < 4);
    check('the puzzle is looked up by date string',
          A.puzzleFor(day0.date).w === day0.w && A.puzzleFor('1999-01-01') === null);

    // ---------- tiles, including repeated letters ----------
    const repeatDay = A.manifest.days.find(x => new Set(x.w).size < x.w.length);
    useDay(repeatDay.date);
    const answer = A.wordFor();
    check('tiles match the scrambled word', tiles().length === answer.length, answer.length + ' tiles');
    check('answer slots match the word length', answerSlots().length === answer.length);
    check('every slot starts empty', A.currentInput() === '');

    /* The chosen word has a repeated letter: placing it twice has to consume two
       different tiles, which is the whole reason tiles are tracked by index. */
    const doubled = [...answer].find((c, i) => answer.indexOf(c) !== i);
    A.typeLetter(doubled);
    A.typeLetter(doubled);
    check('a repeated letter can be placed twice', A.currentInput() === doubled + doubled,
          `${answer}: ${A.currentInput()}`);
    check('two distinct tiles were consumed', A.usedTileIndexes().size === 2);
    A.clearInput();
    check('clear empties the answer', A.currentInput() === '');

    tiles()[0].click();
    check('tapping a tile fills the next slot', A.currentInput().length === 1);
    check('a consumed tile is disabled', tiles()[0].disabled && tiles()[0].classList.contains('spent'));
    answerSlots()[0].click();
    check('tapping a placed tile returns it', A.currentInput() === '' && !tiles()[0].disabled);

    // ---------- submitting ----------
    useDay(repeatDay.date);
    check('an empty submission is refused and costs nothing',
          A.submitGuess() === 'empty' && A.progressFor().attemptsUsed === 0);

    A.typeLetter(A.wordFor()[0]);
    check('a short submission is refused and costs nothing',
          A.submitGuess() === 'short' && A.progressFor().attemptsUsed === 0);

    /* Swap a tile's letter behind the game's back so the answer no longer uses
       the letters on offer — the guard that catches a pasted or injected word. */
    A.clearInput();
    typeWord(A.wordFor());
    const realTiles = A.state.tiles;
    A.state.tiles = realTiles.map((t, i) => (i === 0 ? { letter: 'z' } : t));
    const verdict = A.submitGuess();
    A.state.tiles = realTiles;
    check('a guess using letters you do not have is refused, at no cost',
          verdict === 'letters' && A.progressFor().attemptsUsed === 0, verdict);

    // a wrong but well-formed guess
    useDay(repeatDay.date);
    const scrambled = A.scrambleFor();
    typeWord(scrambled);                                  // the scramble itself is never the answer
    check('a wrong guess is accepted as an attempt', A.submitGuess() === 'wrong');
    check('the attempt is counted', A.progressFor().attemptsUsed === 1);
    check('the guess is remembered', A.progressFor().guesses[0] === scrambled);
    check('the guess is shown in the history', d.querySelectorAll('#history .past-guess').length === 1);
    check('the input is cleared but the tiles remain',
          A.currentInput() === '' && tiles().length === scrambled.length);
    check('an attempt marker is spent', d.querySelectorAll('#attempts .pip.spent').length === 1);

    typeWord(scrambled);
    check('the same guess twice is refused', A.submitGuess() === 'duplicate');
    check('a repeat costs no attempt', A.progressFor().attemptsUsed === 1);
    A.clearInput();

    // ---------- shuffle: free of attempts, but two to a word ----------
    const beforeShuffle = tiles().map(t => t.textContent).sort().join('');
    check('the button says how many shuffles are left before any are spent',
          el('btn-shuffle').textContent === 'Shuffle (2)', el('btn-shuffle').textContent);

    check('the first shuffle works', A.shuffleTiles() === true);
    check('shuffle keeps the same letters',
          tiles().map(t => t.textContent).sort().join('') === beforeShuffle);
    check('shuffle costs no attempt', A.progressFor().attemptsUsed === 1);
    check('and the count comes down', el('btn-shuffle').textContent === 'Shuffle (1)',
          el('btn-shuffle').textContent);

    check('the second shuffle works too', A.shuffleTiles() === true);
    check('after two the button is spent and says so',
          el('btn-shuffle').disabled && el('btn-shuffle').textContent === 'Shuffle (0)',
          el('btn-shuffle').textContent);

    const trayAtLimit = tiles().map(t => t.textContent).join('');
    check('a third press does nothing at all', A.shuffleTiles() === false);
    check('and does not move the letters', tiles().map(t => t.textContent).join('') === trayAtLimit);

    /* A new word hands back two more. */
    useDay(repeatDay.date);
    check('a new word resets the shuffles',
          el('btn-shuffle').textContent === 'Shuffle (2)' && !el('btn-shuffle').disabled,
          el('btn-shuffle').textContent);

    /* The two exclusions, exercised rather than reasoned about. A five-letter
       word has 120 arrangements, so a few hundred presses would land on the
       answer several times over if nothing were stopping it. The cap is lifted
       between presses because it is the guard being tested here, not the limit. */
    const shuffleDay = A.manifest.days.find(x => x.w.length === 5 && new Set(x.w).size === 5);
    useDay(shuffleDay.date);
    const trayText = () => tiles().map(t => t.textContent).join('');
    let spelledAnswer = 0, satStill = 0;
    for (let i = 0; i < 400; i++) {
      const previous = trayText();
      A.progressFor().shufflesUsed = 0;
      if (A.shuffleTiles() !== true) continue;
      if (trayText() === A.wordFor()) spelledAnswer++;
      if (trayText() === previous) satStill++;
    }
    check('four hundred shuffles never lay the answer out on the tray',
          spelledAnswer === 0, spelledAnswer + ' times on ' + shuffleDay.w);
    check('and never hand back the arrangement they started from',
          satStill === 0, satStill + ' times');
    A.progressFor().shufflesUsed = 0;

    // ---------- solving ----------
    useDay(repeatDay.date);
    check('a correct guess is accepted', solveCurrent() === 'correct');
    check('the word is marked solved', A.progressFor().solved && A.progressFor().resolved);
    check('the answer and its definition are revealed',
          !el('reveal').hidden && el('reveal-word').textContent === A.wordFor().toUpperCase() &&
          el('reveal-def').textContent.length > 0);
    A.advance();
    check('solving the word ends the day', A.state.gameStatus === 'dayComplete',
          A.state.gameStatus);
    check('and the results panel is up', !el('results').hidden);

    // ---------- hints ----------
    useDay(repeatDay.date);
    check('no hint is offered before three wrong attempts', A.hintAvailable() === false);
    for (let i = 1; i <= 3; i++) attempt(i);
    check('three wrong attempts are counted', A.progressFor().attemptsUsed === 3);
    check('the hint is offered after three', A.hintAvailable() === true);
    check('the hint button is showing', !el('btn-hint').hidden && !el('btn-hint').disabled);

    A.clearInput();
    A.applyHint();
    check('the hint reveals the first letter',
          A.currentInput()[0] === A.wordFor()[0], A.currentInput());
    check('the hint is recorded', A.progressFor().hintUsed === true);
    check('the hinted letter is locked in place',
          A.removeAt(0) === false && A.currentInput()[0] === A.wordFor()[0]);
    A.clearInput();
    check('clearing the answer leaves the hint alone', A.currentInput()[0] === A.wordFor()[0]);
    check('only one hint per day', A.hintAvailable() === false && el('btn-hint').hidden);

    // ---------- running out of attempts ----------
    for (let i = 4; i <= 12 && !A.progressFor().resolved; i++) attempt(i);
    check('five attempts end the word', A.progressFor().resolved && !A.progressFor().solved);
    check('the answer is revealed on failure',
          el('reveal-word').textContent === A.wordFor().toUpperCase());
    check('the definition is shown with it', el('reveal-def').textContent.length > 0);
    check('the failure is filed in the distribution', A.save.stats.distribution.failed >= 1);

    // ---------- giving up ----------
    useDay(repeatDay.date);
    check('giving up resolves the word as a miss',
          A.skipSlot() === true && A.progressFor().resolved && !A.progressFor().solved);

    // ---------- keyboard only (acceptance 5) ----------
    useDay(repeatDay.date);
    closeModals();
    [...A.wordFor()].forEach(c => press(w, c));
    check('typing fills the answer', A.currentInput() === A.wordFor(), A.currentInput());
    press(w, 'Backspace');
    check('backspace takes a letter back', A.currentInput().length === A.wordFor().length - 1);
    press(w, A.wordFor().slice(-1));
    press(w, 'Enter');
    check('enter submits, and the whole word is playable from the keyboard',
          A.progressFor().solved === true);
    press(w, 'Enter');
    check('enter also dismisses the reveal', el('reveal').hidden === true);

    // ---------- pasting ----------
    useDay(repeatDay.date);
    check('a pasted answer is accepted when the letters fit',
          A.applyPaste(' ' + A.wordFor().toUpperCase() + '! ') === true &&
          A.currentInput() === A.wordFor());
    A.clearInput();
    check('a paste using letters you do not have is refused whole',
          A.applyPaste('zzzz') === false && A.currentInput() === '');
    check('an over-long paste is refused', A.applyPaste('abcdefghijklmnop') === false);

    // ---------- announcements (acceptance 6) ----------
    useDay(repeatDay.date);
    check('the word is announced on arrival',
          el('live').textContent.includes(A.wordFor().length + ' letters'), el('live').textContent);
    A.shuffleTiles();
    check('shuffling is announced, with what it cost',
          /^Letters shuffled\. 1 shuffle left\.$/.test(el('live').textContent),
          el('live').textContent);
    A.shuffleTiles();
    check('and the last one says it was the last one',
          /last one/.test(el('live').textContent), el('live').textContent);
    A.typeLetter('z') || A.submitGuess();
    check('a refusal is announced', el('live').textContent.length > 0);
    check('tiles carry a label for screen readers',
          tiles()[0].getAttribute('aria-label').startsWith('Letter'));
    check('answer positions are labelled',
          answerSlots()[0].getAttribute('aria-label').includes('Position 1'));

    // ---------- streaks over a simulated week (acceptance 3) ----------
    const streakLog = [];
    A.save.lastPlayedDate = '';
    A.save.stats = A.blankStats();

    function simulate(date, action) {
      A.state.puzzleDate = date;
      if (action === 'away') return;               // no play at all
      A.notePlayed();
      if (action === 'solved') A.noteSolved();
      streakLog.push(`${date.slice(-2)}:${action}=${A.save.stats.currentStreak}`);
    }

    simulate('2026-03-01', 'solved');
    check('day 1 solved starts the streak', A.save.stats.currentStreak === 1);
    simulate('2026-03-02', 'solved');
    check('day 2 solved continues it', A.save.stats.currentStreak === 2);
    simulate('2026-03-03', 'played');              // played, solved nothing
    check('a day played but not solved holds the streak', A.save.stats.currentStreak === 2);
    simulate('2026-03-04', 'solved');
    check('solving again after a held day increments', A.save.stats.currentStreak === 3);
    simulate('2026-03-05', 'away');                // the skipped day
    check('a missed day does not change anything by itself', A.save.stats.currentStreak === 3);
    simulate('2026-03-06', 'solved');
    check('a day with no play at all breaks the streak, and the new day restarts it',
          A.save.stats.currentStreak === 1, streakLog.join(' '));
    simulate('2026-03-07', 'solved');
    check('the streak builds again', A.save.stats.currentStreak === 2);
    check('max streak remembers the best run', A.save.stats.maxStreak === 3);
    check('days played counted every day that was played', A.save.stats.daysPlayed === 6,
          String(A.save.stats.daysPlayed));

    /* The guard that used to stop two words counting one day twice. One word
       cannot, but the record it protects is somebody's, so it stays checked. */
    A.save.stats = A.blankStats();
    A.state.puzzleDate = '2026-04-01';
    A.notePlayed(); A.noteSolved(); A.noteSolved();
    check('a day can only ever count once towards the streak',
          A.save.stats.currentStreak === 1);

    // ---------- share text (acceptance 4) ----------
    const permutations = [
      { solved: true,  attemptsUsed: 1, hintUsed: false },
      { solved: true,  attemptsUsed: 5, hintUsed: false },
      { solved: true,  attemptsUsed: 4, hintUsed: true },
      { solved: false, attemptsUsed: 5, hintUsed: false },
      { solved: false, attemptsUsed: 5, hintUsed: true }
    ];
    /* Held to a strict template. "Anagram", "hint" and "day streak" are the only
       prose allowed, so any letter of the answer leaking in would break the
       match. Checking letter-by-letter instead would be meaningless: the fixed
       title alone contains a, n, g, r and m. */
    const MARKS = '[\u{1F7E9}\u{1F7E5}⬜\u{1F4A1}]{5}';
    const SCORE = '\\((?:[1-5](?:, hint)?|X)\\)';
    const TEMPLATE = new RegExp(
      '^Anagram #\\d+' +
      '\\n' + MARKS + ' ' + SCORE +
      '(?:\\n\u{1F525} \\d+ day streak)?$', 'u');

    let offTemplate = '', leaked = '';
    permutations.forEach(p => {
      Object.assign(A.progressFor(), p, { resolved: true });
      const text = A.shareText();
      if (!TEMPLATE.test(text)) offTemplate = JSON.stringify(text);
      if (text.toLowerCase().includes(A.wordFor())) leaked = text;
      /* FR-7.6 is about a URL carrying the answer. The # in "Anagram #3" is a
         puzzle number, not a fragment, so match links rather than punctuation. */
      if (/https?:|www\.|\/\/|\.com/i.test(text)) leaked = text;
    });
    check('share text holds to the emoji template in every outcome, so no letter leaks',
          offTemplate === '', offTemplate);
    check('share text contains the answer nowhere, and no link that could carry it',
          leaked === '', leaked);
    check('share text carries the puzzle number',
          A.shareText().startsWith('Anagram #' + A.state.puzzleNumber), A.shareText().split('\n')[0]);
    check('share text is one line of marks, not two',
          A.shareText().split('\n').filter(l => /[\u{1F7E9}\u{1F7E5}⬜]/u.test(l)).length === 1,
          JSON.stringify(A.shareText()));

    Object.assign(A.progressFor(), { solved: true, attemptsUsed: 2, hintUsed: false, resolved: true });
    check('a solved word shows one marker per attempt',
          A.shareLine() === '\u{1F7E9}\u{1F7E9}⬜⬜⬜ (2)', A.shareLine());
    Object.assign(A.progressFor(), { solved: true, attemptsUsed: 4, hintUsed: true, resolved: true });
    check('a hint is flagged in the share text',
          A.shareLine().includes('\u{1F4A1}') && A.shareLine().includes('hint'), A.shareLine());
    check('a missed word shares as X', (() => {
      Object.assign(A.progressFor(), { solved: false, attemptsUsed: 5, hintUsed: false });
      return A.shareLine().endsWith('(X)');
    })());

    // ---------- rollover mid-session ----------
    A.state.puzzleDate = '2026-03-01';             // pretend the tab has been open a while
    const wordBefore = A.wordFor();
    A.checkRollover();
    check('a rollover shows a prompt', !el('banner').hidden);
    check('the puzzle is not swapped underneath the player', A.wordFor() === wordBefore);
    el('banner').hidden = true;

    // ---------- countdown ----------
    check('the countdown is a clock, not a counter', /^\d{2}:\d{2}:\d{2}$/.test(el('countdown').textContent),
          el('countdown').textContent);
    check('the countdown is computed from the clock',
          A.nextRolloverMs() > Date.now() && A.nextRolloverMs() - Date.now() <= 86400000);

    // ---------- corrupt, foreign, or older saved state ----------
    w.localStorage.setItem(A.STORE_KEY, '{ this is not json');
    check('unparseable saved state is discarded, not surfaced',
          A.loadSave().stats.daysPlayed === 0);
    w.localStorage.setItem(A.STORE_KEY, JSON.stringify({ schemaVersion: 99, stats: { daysPlayed: 7 } }));
    check('a save from an unknown schema is discarded', A.loadSave().stats.daysPlayed === 0);

    /* A record from the two-word day. The streak is the part somebody would
       actually miss, so none of it is thrown away for the sake of a rename. */
    w.localStorage.setItem(A.STORE_KEY, JSON.stringify({
      schemaVersion: 1,
      lastPlayedDate: '2026-05-01',
      progress: { date: '2026-05-01', word1: { solved: true }, word2: { solved: false } },
      stats: {
        daysPlayed: 30, daysBothSolved: 21, currentStreak: 9, maxStreak: 14,
        lastCompletedDate: '2026-05-01', lastStreakDate: '2026-05-01',
        distribution: {
          word1: { 1: 2, 2: 5, 3: 6, 4: 4, 5: 1, failed: 3 },
          word2: { 1: 0, 2: 1, 3: 3, 4: 6, 5: 2, failed: 9 }
        }
      }
    }));
    const carried = A.loadSave();
    check('a two-word record is carried over rather than dropped',
          carried.stats.daysPlayed === 30 && carried.schemaVersion === A.SCHEMA_VERSION);
    check('the streak survives the change', carried.stats.currentStreak === 9 &&
          carried.stats.maxStreak === 14);
    check('days both words fell become days solved', carried.stats.daysSolved === 21);
    check('the distribution carries the word that still exists, and does not add the two together',
          carried.stats.distribution[2] === 5 && carried.stats.distribution.failed === 3,
          JSON.stringify(carried.stats.distribution));
    check('and the half-finished old board is not restored as this one',
          carried.progress === null);
    w.localStorage.removeItem(A.STORE_KEY);

    // ---------- playable without persistence (acceptance 9) ----------
    const realSetItem = w.localStorage.setItem.bind(w.localStorage);
    w.localStorage.setItem = () => { throw new Error('storage blocked'); };
    useDay(repeatDay.date);
    const blockedVerdict = solveCurrent();
    w.localStorage.setItem = realSetItem;
    check('the game plays on when storage refuses to write', blockedVerdict === 'correct');

    // ---------- 360px layout (acceptance 8) ----------
    closeModals();
    el('reveal').hidden = true;
    useDay(A.manifest.days.find(x => x.w.length === 8).date);
    await wait(60);
    check('the page does not scroll sideways at 360px',
          d.documentElement.scrollWidth <= 360, 'scrollWidth ' + d.documentElement.scrollWidth);

    const smallTiles = tiles().filter(t => t.getBoundingClientRect().width < 44 ||
                                           t.getBoundingClientRect().height < 44);
    check('letter tiles meet the 44px tap target', smallTiles.length === 0,
          smallTiles.length ? Math.round(tiles()[0].getBoundingClientRect().width) + 'px' : '');

    const controls = [...d.querySelectorAll('.controls .btn, .btn-submit, .icon-btn')]
      .filter(b => !b.hidden && b.getBoundingClientRect().height > 0);
    const smallControls = controls.filter(b => b.getBoundingClientRect().height < 44);
    check('controls meet the 44px tap target', smallControls.length === 0,
          smallControls.map(b => b.id + ' ' + Math.round(b.getBoundingClientRect().height)).join(', '));

    const smallSlots = answerSlots().filter(s => s.getBoundingClientRect().width < 44);
    check('answer positions meet the 44px tap target', smallSlots.length === 0,
          smallSlots.length ? Math.round(answerSlots()[0].getBoundingClientRect().width) + 'px' : '');

    // ---------- a refresh restores the day exactly (acceptance 2) ----------
    const today = A.todayKey();
    const realDay = A.manifest.days.find(x => x.date === today) || A.manifest.days[0];
    w.localStorage.setItem(A.STORE_KEY, JSON.stringify({
      schemaVersion: A.SCHEMA_VERSION,
      lastPlayedDate: today,
      progress: {
        date: today,
        word: { solved: false, attemptsUsed: 3, guesses: ['bbbbbbb'], resolved: false, hintUsed: true }
      },
      stats: Object.assign(A.blankStats(), { daysPlayed: 4, currentStreak: 3, maxStreak: 3 })
    }));

    /* A fresh frame rather than a reload of this one: reloading the frame the
       suite is attached to re-fires its load handler, and the second run fights
       the first over the same storage. */
    const frame2 = document.createElement('iframe');
    frame2.width = 360;
    frame2.height = 900;
    await new Promise(done => {
      frame2.addEventListener('load', done, { once: true });
      frame2.src = 'index.html?refresh-test';
      document.body.appendChild(frame2);
    });
    await wait(500);

    const w2 = frame2.contentWindow;
    const d2 = w2.document;
    const A2 = w2.ANAGRAM;
    d2.querySelectorAll('.modal:not([hidden])').forEach(m => (m.hidden = true));

    check('a refresh returns to the word in play', A2.state.activeSlot === A2.SLOT,
          A2.state.activeSlot);
    check('attempts used survive the refresh', A2.progressFor().attemptsUsed === 3);
    check('the guess history survives', A2.progressFor().guesses.length === 1);
    check('the word is still unfinished', A2.progressFor().resolved === false);
    check('the streak survives', A2.save.stats.currentStreak === 3);
    check('a revealed hint is still revealed',
          A2.progressFor().hintUsed === true &&
          A2.currentInput()[0] === A2.wordFor()[0],
          A2.currentInput());
    check('the hint is still locked after a refresh', A2.state.lockedSlots.length === 1);

    // ---------- practice, once the day is done ----------
    /* The day's puzzle stays one-shot; what changes is that finishing it no
       longer leaves you with nothing to play. */
    const manifest = A.manifest;
    check('the manifest ships a practice pool',
          Array.isArray(manifest.practice) && manifest.practice.length >= 40,
          Array.isArray(manifest.practice) ? manifest.practice.length + ' words' : 'missing');

    const calendarWords = new Set(manifest.days.map(day => day.w));
    const practiceWords = manifest.practice.map(x => x.w);
    check('no practice word is ever a puzzle from the calendar',
          practiceWords.every(word => !calendarWords.has(word)));
    check('every practice word carries its definition and arrangement',
          manifest.practice.every(x => x.d && x.s > 0));
    check('practice words keep to the same 5 to 8 letters',
          manifest.practice.every(x => x.w.length >= 5 && x.w.length <= 8));

    /* Set up a finished day with a record worth protecting. */
    const dayKey = A.todayKey();
    A.save.progress = A.blankProgress(dayKey);
    Object.assign(A.progressFor(), { solved: true, attemptsUsed: 2, resolved: true });
    A.save.stats = Object.assign(A.blankStats(), {
      daysPlayed: 4, daysSolved: 3, currentStreak: 3, maxStreak: 5, lastStreakDate: dayKey
    });
    A.save.lastPlayedDate = dayKey;
    A.persist();

    const recordBefore = JSON.stringify(A.save.stats);
    const savedBefore = w.localStorage.getItem(A.STORE_KEY);

    check('a practice round can be started', A.startPractice() === true);
    check('the game knows it is practice', A.inPractice() === true);
    check('practice deals a word from the practice pool',
          practiceWords.includes(A.wordFor()), A.wordFor());
    check('practice words are scrambled, not handed over',
          A.scrambleFor() !== A.wordFor(), A.scrambleFor());
    check('practice starts with a clean slate', A.progressFor().attemptsUsed === 0);

    /* Play it out and fail it, which would move every counter if practice were
       being recorded. */
    for (let i = 0; i < A.ATTEMPTS; i++) {
      A.clearInput();
      typeWord(wrongGuess(i + 1));
      A.submitGuess();
    }
    check('a practice round can be played to its end', A.progressFor().resolved === true);

    check('practice leaves the streak and stats untouched',
          JSON.stringify(A.save.stats) === recordBefore);
    check('practice is never written to storage',
          w.localStorage.getItem(A.STORE_KEY) === savedBefore);
    check('the day it was played on is not marked again', A.save.lastPlayedDate === dayKey);

    A.leavePractice();
    check('leaving practice returns to the day', A.inPractice() === false);
    check('the day is still finished', A.progressFor().resolved === true);
    check('the day record is exactly as it was', JSON.stringify(A.save.stats) === recordBefore);

    check('another practice round can be started', A.startPractice() === true);
    A.leavePractice();

    // ---------- the finished day shows the word ----------
    A.save.progress = A.blankProgress(dayKey);
    Object.assign(A.progressFor(), { solved: false, attemptsUsed: 5, resolved: true });
    A.showResults();
    await wait(60);

    const finishedRows = [...d.querySelectorAll('#slots .finished-row')];
    check('the day ends on one word, not a pair', finishedRows.length === 1,
          finishedRows.length + ' rows');
    check('the word is spelled out in full',
          finishedRows[0].textContent.toLowerCase().includes(A.wordFor()),
          finishedRows[0].textContent);
    check('the word that beat you is marked as missed',
          finishedRows[0].querySelectorAll('.answer-slot.missed').length === A.wordFor().length);
    check('the answer line carries the word and how it went',
          el('res-word').textContent === A.wordFor().toUpperCase() &&
          el('res-attempt').textContent.length > 0,
          el('res-word').textContent + ' / ' + el('res-attempt').textContent);
    check('the label says the day is over', el('slot-label').textContent.includes('Today'),
          el('slot-label').textContent);
    check('the tray and controls step aside', el('tray').hidden && el('controls').hidden &&
          el('btn-submit').hidden && el('attempts-row').hidden);

    // ---------- attempts are counted out loud ----------
    /* This plays a real guess, which moves the record. Put it back afterwards so
       the checks that follow still see the day they set up. */
    const recordAside = JSON.stringify(A.save.stats);
    const playedAside = A.save.lastPlayedDate;
    useDay(repeatDay.date);
    check('the attempt dots are labelled with a number',
          el('attempts').textContent.trim() === A.ATTEMPTS + ' left',
          el('attempts').textContent.trim());
    attempt(1);
    check('the number goes down with each attempt',
          el('attempts').textContent.trim() === (A.ATTEMPTS - 1) + ' left',
          el('attempts').textContent.trim());

    A.save.stats = JSON.parse(recordAside);
    A.save.lastPlayedDate = playedAside;
    A.save.progress = A.blankProgress(dayKey);
    Object.assign(A.progressFor(), { solved: true, attemptsUsed: 2, resolved: true });
    A.showResults();
    await wait(40);

    // ---------- the Today / Practice control ----------
    const modeBtn = mode => d.querySelector(`.mode-btn[data-mode="${mode}"]`);
    check('the game offers Today and Practice', !!modeBtn('daily') && !!modeBtn('practice'));
    check('Today is marked while the day is on show',
          modeBtn('daily').getAttribute('aria-pressed') === 'true' &&
          modeBtn('practice').getAttribute('aria-pressed') === 'false');

    modeBtn('practice').click();
    await wait(80);
    check('the Practice button starts a practice round', A.inPractice() === true);
    check('Practice is marked while it runs',
          modeBtn('practice').getAttribute('aria-pressed') === 'true' &&
          modeBtn('daily').getAttribute('aria-pressed') === 'false');

    modeBtn('daily').click();
    await wait(80);
    check('the Today button comes back to the day', A.inPractice() === false);
    check('the day is still finished, and still recorded',
          A.progressFor().resolved === true &&
          JSON.stringify(A.save.stats) === recordBefore);

  } catch (err) {
    check('suite ran to the end', false, err.message + ' @ ' + (err.stack || '').split('\n')[1]);
  }

  document.getElementById('out').textContent = results.join(String.fromCharCode(10));
});
</script>
</body></html>
