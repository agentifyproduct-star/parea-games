<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head>
<body>
<iframe id="f" src="index.html" width="700" height="900"></iframe>
<pre id="out">running</pre>
<script>
const results = [];
const check = (n, c, x) => results.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && x !== '' ? ' :: ' + x : ''));
const wait = ms => new Promise(r => setTimeout(r, ms));
window.addEventListener('error', e => results.push('FAIL pageerror :: ' + e.message));
const press = (w, key) => w.document.dispatchEvent(new w.KeyboardEvent('keydown', {key, bubbles: true}));
const type = (w, t) => { for (const c of t) press(w, c); };
const tiles = (d, r) => [...d.querySelectorAll(`.tile[data-row="${r}"]`)];
const rowText = (d, r) => tiles(d, r).map(t => t.textContent).join('');
const scoredCount = (d, r) => d.querySelectorAll(`.tile[data-row="${r}"].correct, .tile[data-row="${r}"].present, .tile[data-row="${r}"].absent`).length;

document.getElementById('f').addEventListener('load', async () => {
  const w = document.getElementById('f').contentWindow;
  const d = w.document;

  let seen = [];
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (n.classList && n.classList.contains('toast')) seen.push(n.textContent);
  }))).observe(d.getElementById('toast-area'), { childList: true });
  const since = () => { const s = seen.join(' | '); seen = []; return s; };

  try {
    const help = d.getElementById('help-modal');
    if (!help.hidden) help.querySelector('[data-close]').click();

    // ---------- word banks for every length ----------
    check('supports 4 through 7', [4,5,6,7].every(n => w.WORDS.supports(n)));
    check('rejects unsupported lengths', !w.WORDS.supports(3) && !w.WORDS.supports(8));

    for (const n of [4,5,6,7]) {
      const pool = w.WORDS.answers(n);
      check(`${n}-letter pool is populated`, pool.length > 200, pool.length + ' words');
      check(`${n}-letter pool is all ${n}-letter a-z`,
            pool.every(x => x.length === n && /^[a-z]+$/.test(x)));
      check(`${n}-letter pool has no duplicates`, new Set(pool).size === pool.length,
            new Set(pool).size + '/' + pool.length);
      check(`every ${n}-letter answer is a valid guess`, pool.every(x => w.WORDS.isValid(x)));
    }

    // lengths must not bleed into each other
    check('4-letter guess not valid at other lengths', w.WORDS.isValid('bear') && !w.WORDS.isValid('beardless'));
    check('length inferred from the word', w.WORDS.isValid('planet') && w.WORDS.isValid('crane') && w.WORDS.isValid('gold'));
    check('junk rejected at every length',
          !w.WORDS.isValid('zzzz') && !w.WORDS.isValid('zzzzz') &&
          !w.WORDS.isValid('zzzzzz') && !w.WORDS.isValid('zzzzzzz'));
    check('ordinary seven-letter words are accepted',
          ['picture', 'freedom', 'morning', 'company'].every(x => w.WORDS.isValid(x)));

    /* Ordinary words that are not in the answer pool must still be accepted
       outright, with no dictionary call. These were all refused before the
       lexicon was expanded. */
    const OFF_POOL = {
      4: ['husk','onyx','vlog','wifi','sift','mull'],
      5: ['plumb','mocha','fjord','clasp','brine','tepid','emoji'],
      6: ['jigsaw','wombat','soothe','marvel','banjos','online','selfie','sudoku']
    };
    for (const n of [4,5,6]) {
      const pool = new Set(w.WORDS.answers(n));
      const offPool = OFF_POOL[n].filter(x => !pool.has(x));
      const refused = offPool.filter(x => !w.WORDS.isValid(x));
      check(`${n}-letter real words outside the answer pool are accepted`,
            offPool.length >= 4 && refused.length === 0,
            refused.length ? 'refused: ' + refused.join(', ') : offPool.length + ' checked');
    }
    check('lexicon is a whole dictionary, not a word list',
          [4,5,6].every(n => OFF_POOL[n].every(x => w.WORDS.isValid(x))));

    // ---------- six months of daily words, per board ----------
    /* The archive is the days a board was actually played, not a word invented
       for every date. Boards walk their running order a step per turn now, so a
       four-letter word on a seven-letter day would be a fiction. */
    const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const now = new Date();
    let archived = 0;

    for (const n of [4,5,6,7]) {
      const hist = w.WORDS.history(n);
      archived += hist.length;
      check(`${n}-letter archive holds only days that board was played`,
            hist.every(h => w.WORDS.dailyLength(h.date) === n), hist.length + ' days');
      check(`${n}-letter archive words all correct length`,
            hist.every(h => h.word.length === n));
      check(`${n}-letter archive repeats nothing`,
            new Set(hist.map(h => h.word)).size === hist.length,
            new Set(hist.map(h => h.word)).size + ' of ' + hist.length);
      check(`${n}-letter archive stays inside the window`,
            hist.every(h => h.iso <= iso(now)) &&
            (now - hist[0].date) / 86400000 <= 182);
    }
    check('the four archives together account for every day of the window',
          archived === 182, archived + ' days');

    // the boards must advance independently, not in lockstep
    const today = [4,5,6,7].map(n => w.WORDS.dailyWord(n));
    check('each board has its own word today', new Set(today).size === 4, today.join(', '));
    check('daily word is stable for a date',
          w.WORDS.dailyWord(5, new Date(2026,4,3)) === w.WORDS.dailyWord(5, new Date(2026,4,3)));

    // ---------- scoring is length-agnostic ----------
    const s = (g, a) => w.scoreGuess(g, a).map(v => ({correct:'G',present:'Y',absent:'-'})[v]).join('');
    check('4-letter exact', s('gold','gold') === 'GGGG', s('gold','gold'));
    check('6-letter exact', s('planet','planet') === 'GGGGGG', s('planet','planet'));
    // VILLAS has two L, so both guessed L go yellow; a@4 and s@5 are exact, and
    // the answer's only A is consumed by the green, leaving a@2 grey.
    check('6-letter dupes', s('llamas','villas') === 'YY--GG', s('llamas','villas'));
    // PIPE vs PEEP: p@0 exact; the spare P and the single E each colour once,
    // so the second E has nothing left to claim.
    check('4-letter dupes', s('peep','pipe') === 'GY-Y', s('peep','pipe'));

    // ---------- the board follows the picker ----------
    /* Switching away from a practice game asks for confirmation, and a native
     dialog stops a headless run dead. Answer it here. */
  w.confirm = () => true;

  const btn = mode => d.querySelector(`.mode-btn[data-mode="${mode}"]`);

  /* A real word of a given length that is not the answer, so a losing round can
     be played out without the guess being refused. */
  function wrongOfLength(w, len, i) {
    const pool = w.WORDS.answers(len);
    const answer = w.state.answer;
    for (let k = 0; k < pool.length; k++) {
      const word = pool[(i * 37 + k) % pool.length];
      if (word !== answer) return word;
    }
    return answer;
  }

    check('opens on today, not on a fixed board',
          w.state.daily === true && tiles(d, 0).length === w.WORDS.dailyLength(),
          tiles(d, 0).length + ' letters');
    check('there are two modes and no board picker',
          d.querySelectorAll('.mode-btn').length === 2 &&
          d.querySelector('[data-len]') === null);
    check('they read Today and Unlimited',
          [...d.querySelectorAll('.mode-btn')].map(b => b.textContent).join('/') === 'Today/Unlimited',
          [...d.querySelectorAll('.mode-btn')].map(b => b.textContent).join('/'));
    check('Today is the one marked active',
          btn('daily').getAttribute('aria-pressed') === 'true' &&
          btn('unlimited').getAttribute('aria-pressed') === 'false');

    btn('unlimited').click();
    await wait(150);
    check('Unlimited deals a word', w.state.daily === false && w.state.answer.length >= 4);
    check('the board is built to the word it dealt',
          tiles(d, 0).length === w.state.answer.length, tiles(d, 0).length + ' tiles');
    check('Unlimited is marked active, Today is not',
          btn('unlimited').getAttribute('aria-pressed') === 'true' &&
          btn('daily').getAttribute('aria-pressed') === 'false');
    check('grid css follows the word',
          w.getComputedStyle(d.querySelector('.row')).gridTemplateColumns.split(' ').length ===
          w.state.answer.length,
          w.getComputedStyle(d.querySelector('.row')).gridTemplateColumns);

    /* Every unlimited word rolls its own board rather than locking one for the
       session, so a run of them has to reach more than one length. */
    const dealt = {};
    for (let i = 0; i < 120; i++) {
      d.getElementById('btn-new').click();
      dealt[w.state.answer.length] = (dealt[w.state.answer.length] || 0) + 1;
    }
    check('a run of unlimited words reaches every board',
          [4, 5, 6, 7].every(n => dealt[n] > 0), JSON.stringify(dealt));

    /* Put a six-letter board up for the guessing checks that follow. */
    while (w.state.answer.length !== 6) d.getElementById('btn-new').click();
    await wait(150);

    // ---------- playing a 6-letter game ----------
    since();
    type(w, 'planet'); press(w, 'Enter');
    await wait(2600);
    check('6-letter guess accepted and scored',
          rowText(d, 0) === 'planet' && scoredCount(d, 0) === 6,
          rowText(d,0) + ' scored=' + scoredCount(d,0));

    // too-short guess for this length
    type(w, 'crane'); press(w, 'Enter');
    await wait(150);
    check('5 letters is too short on the 6 board', since().includes('Not enough letters'));
    for (let i = 0; i < 6; i++) press(w, 'Backspace');

    // ---------- which board a word is played on ----------
    /* Nobody picks the board any more. Both modes draw from one weight table,
       20 / 10 / 40 / 30 across four, five, six and seven. */
    const todayLen = w.WORDS.dailyLength();
    check('today has a board size of its own', [4, 5, 6, 7].includes(todayLen), todayLen + ' letters');
    check('the same day always gives the same board',
          w.WORDS.dailyLength(new Date('2026-09-01T12:00:00Z')) ===
          w.WORDS.dailyLength(new Date('2026-09-01T12:00:00Z')));
    check('and a different day usually gives a different one',
          new Set([0, 1, 2, 3, 4, 5].map(i =>
            w.WORDS.dailyLength(new Date(Date.parse('2026-09-01T12:00:00Z') + i * 86400000)))).size > 1);

    const declared = {};
    w.WORDS.weights().forEach(row => { declared[row.len] = row.weight; });
    check('the table is the one the requirement asks for',
          JSON.stringify(declared) === JSON.stringify({ 4: 20, 5: 10, 6: 40, 7: 30 }),
          JSON.stringify(declared));

    /* Four thousand days is enough that a weight being wrong by a tenth shows,
       and few enough that the run is instant. */
    const tally = draw => {
      const seen = { 4: 0, 5: 0, 6: 0, 7: 0 };
      for (let i = 0; i < 4000; i++) seen[draw(i)]++;
      return seen;
    };
    const within = (seen, slack) => [4, 5, 6, 7].every(len =>
      Math.abs((seen[len] / 4000) * 100 - declared[len]) <= slack);

    const overDays = tally(i =>
      w.WORDS.dailyLength(new Date(Date.parse('2026-08-19T12:00:00Z') + i * 86400000)));
    check('the daily board follows the table', within(overDays, 2.5),
          JSON.stringify(overDays));

    const overRolls = tally(() => w.WORDS.unlimitedLength());
    check('and so does every unlimited word', within(overRolls, 2.5),
          JSON.stringify(overRolls));

    check('five is the dip, six is the peak',
          overDays[5] < overDays[4] && overDays[6] > overDays[7] && overDays[7] > overDays[4],
          JSON.stringify(overDays));

    /* Each board walks its own running order, a step per turn it actually gets,
       rather than a step per day that passes. Walking by the day meant a board
       burned a place on every day it was not being played, and a 757 word pool
       was handing back a repeat after about a hundred of them. */
    const usedOf = {};
    const dailyOver = [];
    for (let i = 0; i < 6000; i++) {
      const when = new Date(Date.parse('2026-08-27T12:00:00Z') + i * 86400000);
      const len = w.WORDS.dailyLength(when);
      (usedOf[len] = usedOf[len] || []).push(w.WORDS.dailyWord(len, when));
      dailyOver.push(w.WORDS.dailyWord(len, when));
    }
    const distinctBeforeRepeat = list => {
      const seen = new Set();
      for (let i = 0; i < list.length; i++) {
        if (seen.has(list[i])) return i;
        seen.add(list[i]);
      }
      return list.length;
    };
    [4, 6, 7].forEach(len => {
      const pool = w.WORDS.answers(len).length;
      check(`the ${len}-letter board uses its whole pool before repeating`,
            distinctBeforeRepeat(usedOf[len]) >= pool,
            distinctBeforeRepeat(usedOf[len]) + ' of ' + pool);
    });

    /* Five is drawn a tenth of the time, so 6000 days is not enough turns to
       walk all 757 of them. What matters is that it is walking rather than
       skipping: over its own turns, nothing comes back. */
    check('and the five-letter board repeats nothing in the turns it does get',
          distinctBeforeRepeat(usedOf[5]) === usedOf[5].length,
          usedOf[5].length + ' turns, all distinct');

    check('so the daily lasts years rather than months',
          distinctBeforeRepeat(dailyOver) > 1800,
          'first repeat on day ' + (distinctBeforeRepeat(dailyOver) + 1));

    btn('daily').click();
    await wait(200);
    check('Today deals the board today calls for',
          w.state.daily === true && w.state.len === todayLen, w.state.len + ' letters');
    check('Today is the day word for that board', w.state.answer === w.WORDS.dailyWord(todayLen));

    btn('unlimited').click();
    await wait(200);
    check('Unlimited deals its own word, not another daily',
          w.state.daily === false && w.state.answer !== w.WORDS.dailyWord(w.state.len));

    btn('daily').click();
    await wait(250);
    check('Today comes back to the same word',
          w.state.daily === true && w.state.answer === w.WORDS.dailyWord(todayLen));
    check('today is saved under one key, not one per board',
          !!w.localStorage.getItem('arcade.shabda.daily') &&
          !w.localStorage.getItem('arcade.shabda.daily.4'));

    // ---------- winning today ----------
    const ans4 = w.state.answer;
    /* A seven-letter board flips for 2.3 seconds before the game even finishes,
       and the statistics follow two seconds after that. The old 4.2 was tuned
       when six letters was the longest board there was. */
    type(w, ans4); press(w, 'Enter');
    await wait(5600);
    check('a win turns the row green',
          d.querySelectorAll('.tile[data-row="0"].correct').length === todayLen,
          d.querySelectorAll('.tile[data-row="0"].correct').length + ' green');
    check('stats dialog opens', !d.getElementById('stats-modal').hidden);
    /* Today's board is anywhere from 4 to 7 letters depending on the day, so
       both of these are read against the length actually being played.
       Hardcoding one made the suite pass only on the days it happened to
       agree. */
    check('stats name the length being played',
          d.getElementById('st-len').textContent === String(todayLen),
          d.getElementById('st-len').textContent + ' vs ' + todayLen);
    check('that length has recorded 1 play', d.getElementById('st-played').textContent === '1',
          d.getElementById('st-played').textContent);
    check('share label names the length',
          w.shareText().startsWith('Shabda #') && w.shareText().includes(todayLen + ' letters'),
          w.shareText().split('\n')[0]);
    d.getElementById('stats-modal').hidden = true;

    // ---------- when the next puzzle lands ----------
    check('the countdown appears once today is done', !d.getElementById('next-up').hidden);
    check('it reads as a clock',
          /^\d{2}:\d{2}:\d{2}$/.test(d.getElementById('countdown').textContent),
          d.getElementById('countdown').textContent);

    /* ---------- an unlimited round must not touch the record ----------
       Unlimited deals as many words as you want. If those counted, a streak
       would mean nothing more than persistence in one sitting. */
    const beforePractice = w.localStorage.getItem('arcade.shabda.stats');
    w.startGame({ daily: false });
    await wait(120);
    check('an unlimited round is marked as such', w.state.daily === false);

    type(w, w.state.answer);
    press(w, 'Enter');
    /* The row flip runs before the game finishes, and the streak notice lands a
       beat after that, so this has to wait out both, at the longest board. */
    await wait(4400);
    const practiceToasts = since();

    check('winning an unlimited round leaves the record alone',
          w.localStorage.getItem('arcade.shabda.stats') === beforePractice,
          w.localStorage.getItem('arcade.shabda.stats'));
    check('and says the streak is safe rather than that nothing counts',
          practiceToasts.includes('streak is safe') && !/[Pp]ractice/.test(practiceToasts),
          practiceToasts);
    check('unlimited does not open the stats panel', d.getElementById('stats-modal').hidden);
    check('unlimited shows no countdown, having no deadline',
          d.getElementById('next-up').hidden);

    // ---------- one record, whichever board the day lands on ----------
    btn('unlimited').click();
    await wait(200);
    d.getElementById('btn-stats').click();
    await wait(120);
    check('the record is the same one on every board',
          d.getElementById('st-played').textContent === '1',
          'played=' + d.getElementById('st-played').textContent);
    d.getElementById('stats-modal').hidden = true;


    // ---------- R7: the record has two tabs ----------
    /* Everything Unlimited does is written somewhere the daily record cannot be
       reached from, which is the promise the mode is sold on. */
    /* Measured as a change rather than an absolute: rounds earlier in this
       suite have already been played in Unlimited, and clearing the key would
       not clear what the page is holding in memory anyway. */
    const before = JSON.parse(w.localStorage.getItem('arcade.shabda.unlimited') || 'null')
                   || { played: 0, wins: 0 };
    const dailyBefore = w.localStorage.getItem('arcade.shabda.stats');

    btn('unlimited').click();
    await wait(150);
    for (const shouldWin of [true, true, false]) {
      d.getElementById('btn-new').click();
      await wait(60);
      const answer = w.state.answer;
      if (shouldWin) {
        type(w, answer);
        press(w, 'Enter');
      } else {
        for (let i = 0; i < 6; i++) {
          type(w, wrongOfLength(w, answer.length, i));
          press(w, 'Enter');
          await wait(answer.length * 300 + 400);
        }
      }
      await wait(answer.length * 300 + 900);
    }

    const run = JSON.parse(w.localStorage.getItem('arcade.shabda.unlimited') || 'null');
    check('Unlimited keeps a record of its own',
          !!run && run.played === before.played + 3 && run.wins === before.wins + 2,
          JSON.stringify(run) + ' from ' + JSON.stringify(before));
    check('a run counts wins in a row, and a loss ends it',
          run.run === 0 && run.best >= 2, 'run ' + run.run + ', best ' + run.best);
    check('and the daily record is untouched by any of it',
          w.localStorage.getItem('arcade.shabda.stats') === dailyBefore);

    d.getElementById('btn-stats').click();
    await wait(120);
    const tab = m => d.querySelector(`.stat-mode-btn[data-stat="${m}"]`);
    check('the record offers Today and Unlimited', !!tab('daily') && !!tab('unlimited'));
    check('and opens on Today, which is the one with something at stake',
          tab('daily').getAttribute('aria-pressed') === 'true');
    check('Today still says streak', d.getElementById('st-streak-lbl').textContent === 'Current streak');

    tab('unlimited').click();
    await wait(80);
    check('the Unlimited tab shows the Unlimited numbers, not the daily ones',
          d.getElementById('st-played').textContent === String(run.played) &&
          d.getElementById('st-win').textContent === String(Math.round(run.wins / run.played * 100)) &&
          d.getElementById('st-streak').textContent === String(run.run) &&
          d.getElementById('st-max').textContent === String(run.best),
          [d.getElementById('st-played').textContent, d.getElementById('st-win').textContent,
           d.getElementById('st-streak').textContent, d.getElementById('st-max').textContent].join('/'));
    check('run and best replace streak and max',
          d.getElementById('st-streak-lbl').textContent === 'Current run' &&
          d.getElementById('st-max-lbl').textContent === 'Best run');

    /* R7 is explicit: the Unlimited tab never shows streak language. Checked on
       what is actually on screen, since the daily line is still in the markup. */
    const onScreen = () => [
      d.getElementById('st-streak-lbl').textContent,
      d.getElementById('st-max-lbl').textContent,
      d.getElementById('st-scope-daily').hidden ? '' : d.getElementById('st-scope-daily').textContent,
      d.getElementById('st-scope-unlimited').hidden ? '' : d.getElementById('st-scope-unlimited').textContent
    ].join(' ');
    check('and never uses the word streak', !/streak/i.test(onScreen()), onScreen().trim());

    check('the distribution pools every board, with no length filter',
          d.querySelectorAll('.dist-row').length === 6,
          d.querySelectorAll('.dist-row').length + ' rows');

    tab('daily').click();
    await wait(80);
    check('switching back brings the daily record with it',
          d.getElementById('st-streak-lbl').textContent === 'Current streak' &&
          !d.getElementById('st-scope-daily').hidden);

    /* Every figure is a number on both tabs, never an empty cell: a blank reads
       as broken where a zero reads as not yet. The untouched case is checked on
       the homepage, where a game nobody has opened is the ordinary state. */
    tab('unlimited').click();
    await wait(80);
    check('every figure is a number, never a blank cell',
          ['st-played', 'st-win', 'st-streak', 'st-max']
            .every(id => /^\d+$/.test(d.getElementById(id).textContent)),
          ['st-played', 'st-win', 'st-streak', 'st-max']
            .map(id => d.getElementById(id).textContent).join('/'));
    d.getElementById('stats-modal').hidden = true;

    /* ---------- coming back to a day already played ----------

       The day was won near the top of this run, so localStorage holds a
       finished daily. A second frame boots the real page against it, which is
       exactly what happens when someone opens Shabda again later on.

       It gets its own frame rather than reloading this one: the whole suite
       hangs off the first frame's load event, and reloading would run all of it
       a second time. */
    const back = document.createElement('iframe');
    back.width = 700;
    back.height = 900;
    back.src = 'index.html';
    document.body.appendChild(back);
    await new Promise(done => back.addEventListener('load', done, { once: true }));
    await wait(900);   // longer than the 300ms the panel used to wait

    const bd = back.contentDocument;
    check('returning to a finished day does not throw the results up',
          bd.getElementById('stats-modal').hidden === true);
    check('the finished board is still there',
          bd.querySelectorAll('.tile.correct').length >= todayLen,
          bd.querySelectorAll('.tile.correct').length + ' green');
    check('and the countdown says when the next word lands',
          bd.getElementById('next-up').hidden === false &&
          /^\d{2}:\d{2}:\d{2}$/.test(bd.getElementById('countdown').textContent),
          bd.getElementById('countdown').textContent);
    check('the record is still one button away',
          !!bd.getElementById('btn-stats') && bd.getElementById('btn-stats').offsetParent !== null);
    back.remove();

    /* ---------- an Unlimited round survives leaving the page ----------
       Two letters typed and nothing submitted: the round has been started but
       not played, which is the case that used to be thrown away outright. */
    w.startGame({ daily: false, fresh: true });
    await wait(500);
    const unAnswer = w.state.answer;
    type(w, unAnswer.slice(0, 2));
    await wait(120);
    check('unlimited: two letters are on the board',
          w.state.current === unAnswer.slice(0, 2), w.state.current);

    const again = document.createElement('iframe');
    again.width = 700;
    again.height = 900;
    again.src = 'index.html';
    document.body.appendChild(again);
    await new Promise(done => again.addEventListener('load', done, { once: true }));
    await wait(900);

    const aw = again.contentWindow;
    check('unlimited: the page comes back to the round, not to today',
          aw.state.daily === false, 'daily=' + aw.state.daily);
    check('unlimited: on the same word',
          aw.state.answer === unAnswer, aw.state.answer + ' vs ' + unAnswer);
    check('unlimited: with the letters still typed',
          aw.state.current === unAnswer.slice(0, 2), aw.state.current);
    check('unlimited: and Unlimited is the tab showing',
          aw.document.querySelector('.mode-btn[data-mode="unlimited"]')
            .getAttribute('aria-pressed') === 'true');

    /* Play another is the one that deals. */
    /* The refresh is the only way to another word now, and it asks first when
       there is something to lose. Confirm is stubbed to yes for this one. */
    check('unlimited: the refresh is live once you are off today',
          aw.document.getElementById('btn-new').disabled === false);
    /* Saying no keeps the word. This is the whole reason the question exists:
       one stray tap used to cost a round in progress. */
    let asked = 0;
    aw.confirm = () => { asked += 1; return false; };
    aw.document.getElementById('btn-new').click();
    await wait(300);
    check('unlimited: the refresh asks before throwing a round away', asked === 1, asked);
    check('unlimited: and saying no keeps the word and the letters',
          aw.state.answer === unAnswer && aw.state.current === unAnswer.slice(0, 2),
          aw.state.answer + ' / ' + aw.state.current);

    aw.confirm = () => true;
    aw.document.getElementById('btn-new').click();
    await wait(500);
    check('unlimited: the refresh deals a new word instead of resuming',
          aw.state.current === '' && aw.state.guesses.length === 0);

    aw.startGame({ daily: true });
    await wait(300);
    check('today: the refresh is dead, because today has one word',
          aw.document.getElementById('btn-new').disabled === true);
    again.remove();

  } catch (err) {
    results.push('FAIL threw :: ' + err.message + ' @ ' + (err.stack || '').split('\n')[1]);
  }
  document.getElementById('out').textContent = results.join('\n');
});
</script>
</body></html>
