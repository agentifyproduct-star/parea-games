<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Three players ready in a room, with a countdown ring">
  <defs>
    <filter id="rm-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#5a4718" flood-opacity=".14" />
    </filter>
    <linearGradient id="rm-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e4" />
      <stop offset="1" stop-color="#f6ecd8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rm-wash)" />

  <g stroke="#ffffff" stroke-width="1.5" opacity=".75">
    <path d="M0 125h800M0 250h800M0 375h800" />
    <path d="M200 0v500M400 0v500M600 0v500" />
  </g>

  <!-- the countdown, three seconds out -->
  <g transform="translate(232 250)">
    <circle r="96" fill="#ffffff" filter="url(#rm-soft)" />
    <circle r="78" fill="none" stroke="#eadfc4" stroke-width="12" />
    <circle r="78" fill="none" stroke="#c9a227" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="196" transform="rotate(-90)" />
    <text y="26" text-anchor="middle" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif"
          font-weight="800" font-size="76" fill="#3a3326">3</text>
  </g>

  <!-- everyone who is in -->
  <g filter="url(#rm-soft)" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="24">
    <g>
      <rect x="404" y="128" width="284" height="72" rx="20" fill="#ffffff" />
      <circle cx="444" cy="164" r="12" fill="#5a9e4f" />
      <text x="474" y="172" fill="#3a3326" font-weight="700">Ana</text>
      <text x="664" y="172" fill="#9a8f76" text-anchor="end" font-size="19">ready</text>
    </g>
    <g>
      <rect x="404" y="214" width="284" height="72" rx="20" fill="#ffffff" />
      <circle cx="444" cy="250" r="12" fill="#5a9e4f" />
      <text x="474" y="258" fill="#3a3326" font-weight="700">Ben</text>
      <text x="664" y="258" fill="#9a8f76" text-anchor="end" font-size="19">ready</text>
    </g>
    <g>
      <rect x="404" y="300" width="284" height="72" rx="20" fill="#ffffff" />
      <circle cx="444" cy="336" r="12" fill="#5a9e4f" />
      <text x="474" y="344" fill="#3a3326" font-weight="700">Cleo</text>
      <text x="664" y="344" fill="#9a8f76" text-anchor="end" font-size="19">ready</text>
    </g>
  </g>
</svg>
