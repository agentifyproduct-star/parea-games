<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A grid of letter tiles, one row solved in teal and amber">
  <defs>
    <filter id="sh-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2f4b46" flood-opacity=".13" />
    </filter>
    <linearGradient id="sh-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f4" />
      <stop offset="1" stop-color="#e2efec" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sh-wash)" />

  <!-- A quiet grid behind everything, like ruled paper -->
  <g stroke="#ffffff" stroke-width="1.5" opacity=".7">
    <path d="M0 125h800M0 250h800M0 375h800" />
    <path d="M200 0v500M400 0v500M600 0v500" />
  </g>

  <g font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-weight="700"
     font-size="46" text-anchor="middle" filter="url(#sh-soft)">

    <!-- row one: still to guess -->
    <g fill="#ffffff" stroke="#d8ded9" stroke-width="2">
      <rect x="222" y="96" width="72" height="72" rx="11" />
      <rect x="304" y="96" width="72" height="72" rx="11" />
      <rect x="386" y="96" width="72" height="72" rx="11" />
      <rect x="468" y="96" width="72" height="72" rx="11" />
      <rect x="550" y="96" width="72" height="72" rx="11" />
    </g>

    <!-- row two: scored -->
    <g stroke="none">
      <rect x="222" y="196" width="72" height="72" rx="11" fill="#2f9e8f" />
      <rect x="304" y="196" width="72" height="72" rx="11" fill="#ffffff" stroke="#d8ded9" stroke-width="2" />
      <rect x="386" y="196" width="72" height="72" rx="11" fill="#d3873c" />
      <rect x="468" y="196" width="72" height="72" rx="11" fill="#ffffff" stroke="#d8ded9" stroke-width="2" />
      <rect x="550" y="196" width="72" height="72" rx="11" fill="#2f9e8f" />
    </g>
    <text x="258" y="248" fill="#ffffff">W</text>
    <text x="340" y="248" fill="#2b2a27">O</text>
    <text x="422" y="248" fill="#ffffff">R</text>
    <text x="504" y="248" fill="#2b2a27">D</text>
    <text x="586" y="248" fill="#ffffff">S</text>

    <!-- row three: the solve -->
    <g fill="#2f9e8f" stroke="none">
      <rect x="222" y="296" width="72" height="72" rx="11" />
      <rect x="304" y="296" width="72" height="72" rx="11" />
      <rect x="386" y="296" width="72" height="72" rx="11" />
      <rect x="468" y="296" width="72" height="72" rx="11" />
      <rect x="550" y="296" width="72" height="72" rx="11" />
    </g>
    <g fill="#ffffff">
      <text x="258" y="348">S</text>
      <text x="340" y="348">H</text>
      <text x="422" y="348">A</text>
      <text x="504" y="348">R</text>
      <text x="586" y="348">P</text>
    </g>
  </g>
</svg>
