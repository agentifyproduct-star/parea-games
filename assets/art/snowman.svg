<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A snowman losing its hat and scarf, beside a part-guessed word in the Animals category">
  <defs>
    <filter id="hm-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#33452f" flood-opacity=".12" />
    </filter>
    <linearGradient id="hm-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f5ec" />
      <stop offset="1" stop-color="#e6efe1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hm-wash)" />

  <g stroke="#ffffff" stroke-width="1.5" opacity=".75">
    <path d="M0 125h800M0 250h800M0 375h800" />
    <path d="M200 0v500M400 0v500M600 0v500" />
  </g>

  <!-- Two wrong guesses in: the hat and scarf have already gone, and they are
       lying in the slush at his feet. -->
  <g filter="url(#hm-soft)">
    <!-- twig arms -->
    <g stroke="#9b8f7d" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M156 246 L84 210" />
      <path d="M108 222 L96 196" />
      <path d="M108 222 L86 226" />
      <path d="M254 246 L326 210" />
      <path d="M302 222 L314 196" />
      <path d="M302 222 L324 226" />
    </g>

    <!-- body -->
    <circle cx="205" cy="356" r="86" fill="#ffffff" stroke="#cfd6c9" stroke-width="6" />
    <circle cx="205" cy="252" r="66" fill="#ffffff" stroke="#cfd6c9" stroke-width="6" />
    <g fill="#3f4b3a">
      <circle cx="205" cy="226" r="7" />
      <circle cx="205" cy="254" r="7" />
      <circle cx="205" cy="282" r="7" />
    </g>

    <!-- head, still hanging on -->
    <circle cx="205" cy="158" r="48" fill="#ffffff" stroke="#cfd6c9" stroke-width="6" />
    <g fill="#3f4b3a">
      <circle cx="188" cy="146" r="6" />
      <circle cx="222" cy="146" r="6" />
      <circle cx="186" cy="178" r="4" />
      <circle cx="205" cy="183" r="4" />
      <circle cx="224" cy="178" r="4" />
    </g>
    <polygon points="205,160 254,170 205,176" fill="#c07c2c" />
  </g>

  <!-- what has already melted off, in the slush -->
  <ellipse cx="292" cy="432" rx="62" ry="12" fill="#bcd8e4" opacity=".85" />
  <g transform="rotate(-12 300 424)">
    <path d="M266 424 H334" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round" />
    <rect x="282" y="402" width="36" height="24" rx="3" fill="#2f3a2b" />
  </g>
  <path d="M244 436 Q262 424 280 436" stroke="#b4552f" stroke-width="9"
        stroke-linecap="round" fill="none" />

  <path d="M78 440 H352" stroke="#c4cbbc" stroke-width="7" stroke-linecap="round" />

  <g font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- the standing clue, which is the whole of what you get -->
    <g filter="url(#hm-soft)">
      <rect x="446" y="126" width="228" height="54" rx="27" fill="#ffffff" />
      <text x="560" y="161" font-size="24" font-weight="600" fill="#5f6b59">Animals</text>
    </g>

    <!-- the word, part found -->
    <g stroke-width="8" stroke-linecap="round">
      <g stroke="#c4cbbc">
        <path d="M446 300h60M526 300h60M606 300h60M686 300h60" />
      </g>
      <g stroke="#5a9e4f">
        <path d="M446 300h60M606 300h60" />
      </g>
    </g>
    <g font-size="54" font-weight="700" fill="#2f3a2b">
      <text x="476" y="278">G</text>
      <text x="636" y="278">M</text>
    </g>

    <!-- lives left -->
    <g>
      <circle cx="486" cy="366" r="10" fill="#5a9e4f" />
      <circle cx="520" cy="366" r="10" fill="#5a9e4f" />
      <circle cx="554" cy="366" r="10" fill="#5a9e4f" />
      <circle cx="588" cy="366" r="10" fill="#5a9e4f" />
      <circle cx="622" cy="366" r="10" fill="#cfd6c9" />
      <circle cx="656" cy="366" r="10" fill="#cfd6c9" />
      <text x="722" y="374" font-size="21" font-weight="600" fill="#7d8a76" text-anchor="end">4 left</text>
    </g>
  </g>
</svg>
