<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Front page tests</title></head>
<body>
<iframe id="f" src="index.html" width="900" height="700"></iframe>
<pre id="out">running</pre>
<script>
/* The front page is plain HTML that one script quietly annotates: ticks on the
   games finished today, a button that points at the next one, and a dialog
   holding the record across all three. These tests drive it the way a day does
   — nothing played, one game finished, all three finished, and a record left
   over from yesterday. */

const results = [];
const check = (name, condition, detail) => {
  results.push((condition ? 'PASS ' : 'FAIL ') + name + (detail !== undefined && detail !== '' ? ' :: ' + detail : ''));
  document.getElementById('out').textContent = results.join(String.fromCharCode(10));
};

const frame = document.getElementById('f');
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Each case starts from a known record, so reload and let home.js run again. */
function reload() {
  return new Promise(resolve => {
    frame.addEventListener('load', function once() {
      frame.removeEventListener('load', once);
      setTimeout(resolve, 60);
    });
    frame.contentWindow.location.reload();
  });
}

const win = () => frame.contentWindow;
const doc = () => frame.contentWindow.document;
const text = id => (doc().getElementById(id) || {}).textContent;
const cta = () => doc().getElementById('play-cta');
const ticked = () => [...doc().querySelectorAll('.feature.is-done')].map(f => f.dataset.game).join(',');

async function setDay(games, dayKey) {
  win().localStorage.setItem(win().TODAY.KEY, JSON.stringify({
    day: dayKey || win().TODAY.dayKey(),
    games
  }));
  await reload();
}

window.addEventListener('error', e => results.push('FAIL pageerror :: ' + e.message));

frame.addEventListener('load', async function start() {
  frame.removeEventListener('load', start);
  await wait(150);

  try {
    // ---------- the stylesheet arrived whole ----------

    /* Not paranoia: an edit to the headline animation once took the rules
       either side of it with it, and every test still passed because none of
       them looked at the page. These do. */
    const styleOf = (sel, prop) => win().getComputedStyle(doc().querySelector(sel))[prop];

    /* By name, not by index: the page links assets/type.css ahead of its own
       stylesheet, so styleSheets[0] is five @font-face rules and nothing else. */
    const mainSheet = [...doc().styleSheets].find(sheet => (sheet.href || '').includes('styles.css'));

    check('the front page has a stylesheet at all',
          !!mainSheet && mainSheet.cssRules.length > 40,
          mainSheet ? mainSheet.cssRules.length + ' rules' : 'styles.css not linked');
    check('the faces are declared, in their own stylesheet',
          [...doc().styleSheets].some(sheet => (sheet.href || '').includes('type.css')),
          [...doc().styleSheets].map(sheet => (sheet.href || '').split('/').pop()).join(', '));
    check('the strip is a row of three, not a stack',
          styleOf('.strip', 'gridTemplateColumns').split(' ').length === 3,
          styleOf('.strip', 'gridTemplateColumns'));
    check('its cards are cropped cards, not raw pictures',
          parseFloat(styleOf('.strip-item', 'borderTopLeftRadius')) > 8 &&
          styleOf('.strip-item img', 'objectFit') === 'cover',
          styleOf('.strip-item', 'borderTopLeftRadius') + ' / ' + styleOf('.strip-item img', 'objectFit'));
    check('the label sits on the card rather than under it',
          styleOf('.strip-label', 'position') === 'absolute', styleOf('.strip-label', 'position'));
    check('the line under the headline is held to a readable measure',
          styleOf('.hero-note', 'maxWidth') !== 'none', styleOf('.hero-note', 'maxWidth'));
    check('the game rows are laid out in two columns',
          styleOf('.feature', 'gridTemplateColumns').split(' ').length === 2,
          styleOf('.feature', 'gridTemplateColumns'));

    // ---------- a day nobody has started ----------
    win().localStorage.removeItem(win().TODAY.KEY);
    await reload();

    check('the button offers the first game',
          cta().getAttribute('href') === 'games/shabda/index.html', cta().getAttribute('href'));
    check('and says so plainly', cta().textContent === 'Play today', cta().textContent);
    check('no game is ticked yet', ticked() === '', ticked());
    check('the statistics button is there once the script has run',
          doc().getElementById('btn-stats').hidden === false);
    check('the dialog stays shut until asked for',
          doc().getElementById('stats-modal').hidden === true);

    // ---------- one game down ----------
    await setDay({ shabda: 'won' });

    check('the finished game is ticked on its card', ticked() === 'shabda', ticked());
    check('the button moves on to the next unplayed game',
          cta().getAttribute('href') === 'games/snowman/index.html', cta().getAttribute('href'));
    check('and names it', cta().textContent === 'Play Snowman', cta().textContent);

    // ---------- a game in progress is not a game finished ----------
    await setDay({ shabda: 'won', snowman: 'playing' });

    check('a game left half-played still counts as todo',
          cta().getAttribute('href') === 'games/snowman/index.html', cta().getAttribute('href'));
    check('and is not ticked', ticked() === 'shabda', ticked());

    // ---------- the whole day ----------
    await setDay({ shabda: 'won', snowman: 'lost', anagram: 'done' });

    check('every card is ticked', ticked() === 'shabda,snowman,anagram', ticked());
    check('the button stops sending you into a finished game',
          cta().textContent === 'All three done', cta().textContent);

    // ---------- the record, across all three ----------
    win().localStorage.setItem('arcade.shabda.stats',
      JSON.stringify({ played: 9, wins: 7, streak: 3, maxStreak: 5 }));
    win().localStorage.setItem('arcade.snowman.stats',
      JSON.stringify({ played: 2, wins: 1, streak: 0, maxStreak: 2 }));
    win().localStorage.setItem('arcade.anagram.v1',
      JSON.stringify({ stats: { daysPlayed: 4, daysBothSolved: 3, currentStreak: 2, maxStreak: 4 } }));
    await setDay({ shabda: 'won' });

    doc().getElementById('btn-stats').click();
    await wait(60);

    check('the dialog opens on the button', doc().getElementById('stats-modal').hidden === false);
    check('it says where the day stands',
          text('sheet-note') === '1 of 3 done today.', text('sheet-note'));
    check('it has a row for every game', doc().querySelectorAll('.sheet-row').length === 3);

    const first = doc().querySelectorAll('.sheet-row')[0];
    const figures = [...first.querySelectorAll('.sheet-figure b')].map(b => b.textContent).join(' ');
    check('each row carries played, solved, streak and best', figures === '9 78% 3 5', figures);
    check('a game finished today says so',
          first.textContent.indexOf('Solved today') !== -1, first.textContent);
    check('a row is a way into the game',
          first.getAttribute('href') === 'games/shabda/index.html', first.getAttribute('href'));

    const third = doc().querySelectorAll('.sheet-row')[2];
    check("the third game's numbers come from its own shape",
          [...third.querySelectorAll('.sheet-figure b')].map(b => b.textContent).join(' ') === '4 75% 2 4',
          [...third.querySelectorAll('.sheet-figure b')].map(b => b.textContent).join(' '));

    doc().querySelector('.sheet-close').click();
    await wait(40);
    check('and it closes again', doc().getElementById('stats-modal').hidden === true);

    // ---------- nothing played at all ----------
    ['arcade.shabda.stats', 'arcade.snowman.stats', 'arcade.anagram.v1']
      .forEach(key => win().localStorage.removeItem(key));
    win().localStorage.removeItem(win().TODAY.KEY);
    await reload();
    doc().getElementById('btn-stats').click();
    await wait(60);

    check('a new player is invited rather than shown zeros',
          text('sheet-note').indexOf('Nothing played yet') === 0, text('sheet-note'));
    const blank = [...doc().querySelectorAll('.sheet-row')[0].querySelectorAll('.sheet-figure b')]
      .map(b => b.textContent).join(' ');
    check('and the figures read as empty, not as failure', blank === '0 — 0 0', blank);

    // ---------- yesterday is not today ----------
    const yesterday = win().DAILY.shift(win().TODAY.dayKey(), -1);
    await setDay({ shabda: 'won', snowman: 'won', anagram: 'done' }, yesterday);

    check("yesterday's record leaves nothing ticked", ticked() === '', ticked());
    check('and the button starts again at the first game',
          cta().getAttribute('href') === 'games/shabda/index.html', cta().getAttribute('href'));

    // ---------- what the games ask for ----------
    win().localStorage.setItem(win().TODAY.KEY, JSON.stringify({
      day: win().TODAY.dayKey(), games: { shabda: 'won', anagram: 'done' }
    }));
    const T = win().TODAY;
    check('after Shabda, the next game is the unplayed one', T.next('shabda').id === 'snowman', T.next('shabda').id);
    check('the search wraps round the list', T.next('anagram').id === 'snowman', T.next('anagram').id);
    check('and gives up once the day is done',
          (() => {
            win().localStorage.setItem(T.KEY, JSON.stringify({
              day: T.dayKey(), games: { shabda: 'won', snowman: 'won', anagram: 'done' }
            }));
            return T.next('shabda') === null;
          })());

    win().localStorage.removeItem(T.KEY);

  } catch (err) {
    results.push('FAIL threw :: ' + err.message + ' @ ' + (err.stack || '').split(String.fromCharCode(10))[1]);
  }

  document.getElementById('out').textContent = results.join(String.fromCharCode(10));
});
</script>
</body></html>
